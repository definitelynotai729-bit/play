<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thousand Hands</title>
<style>
:root {
  --bg: #06070c; --panel: #0e1119; --panel2: #151a26; --line: #26304a; --text: #e9eefc; --dim: #8c97b5;
  --amber: #ffb43d; --cyan: #3df0ff; --mag: #ff4fe5; --gold: #ffc23d; --green: #69ff7e; --red: #ff4f5e; --blue: #5c86ff;
  --font: system-ui, -apple-system, "Segoe UI", "Cantarell", "Liberation Sans", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
body.clip { cursor: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
#topbar { display: flex; gap: 14px; align-items: center; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 48px; }
#topbar .brand { font-weight: 900; letter-spacing: 0.08em; font-size: 18px; }
#topbar .brand b { color: var(--cyan); }
.pill { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.pill.q { color: var(--amber); }
#relicbar { display: flex; gap: 6px; flex-wrap: wrap; }
#main { display: grid; grid-template-columns: minmax(320px, 430px) 1fr; min-height: 0; }
#side { overflow-y: auto; padding: 12px; border-right: 1px solid var(--line); background: #090b12; }
/* the stage is a grid: lesson banner, HUD, board, doubling markers, progress bar. Nothing is laid over the board
   (tools/boardcover_check.py). .hudcol = the HUD in a column beside the board, when that leaves the bigger board. */
#stage { position: relative; min-height: 0; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto;
  grid-template-areas: "prompt" "hud" "board" "dbl" "bar"; }
#stage.hudcol { grid-template-columns: minmax(0, 1fr) 150px; grid-template-areas: "prompt prompt" "hud2 hud2" "board hud" "dbl hud" "bar bar"; }
#boardwrap { grid-area: board; position: relative; min-height: 0; min-width: 0; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
h2 { margin: 6px 0 8px; font-size: 15px; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; }
.biome { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
.biome .name { font-size: 22px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; }
.biome .desc { color: var(--dim); font-size: 14px; margin-top: 2px; }
.biome .quota { font-size: 18px; font-weight: 800; color: var(--amber); margin-top: 6px; }
#slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.slot { position: relative; aspect-ratio: 3 / 4; border: 2px dashed #34405e; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3b4766; font-size: 26px; font-weight: 900; }
.slot.sel { border-color: var(--cyan); box-shadow: 0 0 0 2px #3df0ff44 inset; }
.slot .idx { position: absolute; top: -9px; left: -7px; background: var(--bg); color: var(--dim); font-size: 11px; font-weight: 800; padding: 0 4px; border-radius: 6px; border: 1px solid var(--line); z-index: 2; }
.slot.hot { border-color: var(--cyan); background: #3df0ff12; }
.slot.run { box-shadow: 0 0 0 3px var(--amber); }
.card { position: relative; width: 100%; height: 100%; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: linear-gradient(160deg, var(--c1), var(--c2)); border: 2px solid var(--c0); color: #fff; font-weight: 900; font-size: 13px; letter-spacing: 0.04em; user-select: none; touch-action: none; text-align: center; line-height: 1.05; }
.card svg { width: 46%; height: auto; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 3px var(--c0)); }
.card .free { position: absolute; top: 4px; right: 5px; font-size: 9px; background: #0008; border-radius: 4px; padding: 1px 3px; color: #cfe; }
.card.ctrl { border-style: dashed; }
#pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 7px; margin-bottom: 12px; }
#pool .pc { aspect-ratio: 3 / 4; cursor: grab; }
#pool .pc.used { opacity: 0.22; cursor: default; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-weight: 800; letter-spacing: 0.04em; }
.btn:hover { border-color: #4a5a85; }
.btn.go { background: linear-gradient(160deg, #ffb43d, #ff7a1a); color: #1a0d00; border-color: #ffcd7a; }
.btn.test { background: linear-gradient(160deg, #1f6bff, #1238a8); border-color: #6c9bff; }
.btn.on { border-color: var(--cyan); color: var(--cyan); }
#info { color: var(--dim); font-size: 13px; min-height: 36px; margin-bottom: 8px; }
#testres { font-size: 14px; font-weight: 700; min-height: 20px; margin-bottom: 8px; }
#hud { grid-area: hud; display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; padding: 6px 10px; min-width: 0; background: #090b12; }
#hud:empty { padding: 0; }
#hud .big { font-size: 26px; font-weight: 900; text-shadow: 0 2px 8px #000; }
#hud .big { white-space: nowrap; }
#hud .lab { font-size: 11px; color: var(--dim); letter-spacing: 0.12em; }
#hud .box { background: #06070c; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; }
#hud .ctl { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
#hud .ctl .btn { padding: 8px 10px; white-space: nowrap; }
#hud-hatch { font-size: 11px; color: #8dffb0; min-height: 14px; min-width: 34px; white-space: nowrap; }
#hud-hatch .long { display: none; }
#stage:not(.hudcol) #hud .box { display: flex; align-items: baseline; gap: 6px; }
#stage:not(.hudcol) #hud .big { font-size: 19px; }
#stage.hudcol #hud { flex-direction: column; flex-wrap: nowrap; align-items: stretch; justify-content: flex-start; overflow: hidden; border-left: 1px solid var(--line); }
#stage.hudcol #hud .ctl { margin: 4px 0 0; display: grid; grid-template-columns: 1fr 1fr; }
#stage.hudcol #hud .ctl .btn { padding: 8px 4px; }
#stage.hudcol #hud .big { font-size: 22px; height: 29px; line-height: 29px; }
#stage.hudcol #hud-hatch .long { display: inline; }
#stage.hudcol #hud-hatch { white-space: normal; min-height: 28px; }
#bar { grid-area: bar; height: 6px; background: #111827; }
#bar > div { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--amber)); width: 0; }
#overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #03040acc; z-index: 20; padding: 16px; }
#overlay.show { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; max-width: 760px; width: 100%; max-height: 100%; overflow-y: auto; }
.modal h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 0.06em; }
.modal p { color: var(--dim); margin: 6px 0 12px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 12px 0; }
.choice { background: var(--panel2); border: 2px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.choice:hover { border-color: var(--cyan); }
.choice .cardwrap { width: 90px; height: 120px; align-self: center; }
.choice .t { font-weight: 900; font-size: 17px; }
.choice .d { color: var(--dim); font-size: 13px; }
.choice .tag { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 800; }
.shoprow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.shoprow .d { color: var(--dim); font-size: 13px; }
.title { text-align: center; }
.title h1 { font-size: clamp(36px, 7vw, 76px); font-weight: 900; letter-spacing: 0.08em; margin: 0; }
.title h1 b { color: var(--cyan); text-shadow: 0 0 24px #3df0ff88; }
.title .hook { font-size: clamp(16px, 2.4vw, 22px); color: var(--text); margin: 8px 0 18px; }
.relic-ico { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; color: #000; }
.stat { font-variant-numeric: tabular-nums; }
@media (max-width: 1000px) { #main { grid-template-columns: 330px minmax(0, 1fr); } }
/* 1280x720 and laptops like it: program, Test Run and the whole hand fit the panel without scrolling */
@media (min-width: 1001px) and (max-height: 800px) {
  #side { padding: 8px 12px; } #side h2 { margin: 2px 0 6px; } #side .biome.m5 { padding: 5px 12px; margin-bottom: 6px; }
  #side .slot { aspect-ratio: auto; height: 78px; } #side #slots { gap: 8px 6px; margin-bottom: 8px; }
  #side .card { font-size: 11px; gap: 2px; } #side .card svg { width: auto; height: 46%; }
  #side #pool { grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 4px; } #side #pool .pc { aspect-ratio: auto; height: 70px; }
  #side .card .free { top: 2px; right: 3px; font-size: 8px; padding: 0 3px; } #side #pool .card:has(.free) { padding-top: 10px; } #side #pool .card:has(.free) svg { height: 40%; }
  #side .btnrow { margin-bottom: 6px; } #side .m5btns .btn { padding: 6px 12px; } #side #testres { margin-bottom: 4px; } #side #coach { margin-bottom: 6px; }
  #side #combo-hint { font-size: 12px; margin-bottom: 4px; }
}
@media (max-height: 450px) { .slot { aspect-ratio: 1 / 1; } #hud .box { padding: 2px 8px; } #stage.hudcol #hud .big { font-size: 18px; height: 24px; line-height: 24px; } #stage.hudcol #hud { gap: 4px; padding: 4px 8px; } #stage.hudcol #hud .ctl .btn { padding: 6px 2px; font-size: 14px; } #stage.hudcol #hud-hatch { min-height: 14px; } #stage.hudcol #hud-hatch .long { display: none; } }
/* phone: one screen that never scrolls as a page. Editing: a board preview on top, the editor below it (it scrolls inside).
   Running (body.running): the board takes the screen, under the HUD; the biome with its quota and the program stay below it. */
@media (max-width: 760px) {
  html, body, #app { height: 100vh; height: 100dvh; }
  #main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  body:not(.running) #hud { display: none; } /* between runs the HUD only repeats the last numbers */
  #stage:has(#th-prompt) { grid-template-rows: auto auto 22vh auto auto; }
  #stage { order: 0; flex: none; grid-template-rows: auto auto 26vh auto auto; }
  #side { order: 1; flex: 1 1 0; min-height: 0; border-right: none; border-top: 1px solid var(--line); }
  #hud .box { flex: 1 1 auto; } #hud .ctl { flex: 1 0 100%; margin: 0; } #hud .ctl .btn { flex: 1 1 0; padding: 8px 4px; }
  #stage:not(.hudcol) #hud .box { display: block; } #hud-hatch { display: inline-block; min-height: 0; }
  #stage:not(.hudcol) #hud #hud-drones { display: inline-block; margin-right: 6px; }
  body.running #stage, body.running #stage:has(#th-prompt) { flex: 1 1 0; grid-template-rows: auto auto minmax(0, 1fr) auto auto; }
  body.running #side { flex: none; overflow: hidden; padding: 8px 12px; }
  body.running #side > :not(.biome):not(#slots):not(.runsum) { display: none; }
  body.running #side .runsum h2, body.running #side .biome .desc { display: none; }
  body.running #side .biome { display: flex; align-items: center; gap: 10px; padding: 4px 12px; margin-bottom: 10px; }
  body.running #side .biome .name { font-size: 16px; } body.running #side .biome .quota { margin: 0 0 0 auto; font-size: 16px; }
  body.running #side #slots { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 60px); gap: 6px; margin: 0; justify-content: center; }
  body.running #side .card { font-size: 9px; letter-spacing: 0; } body.running #side .card .free { display: none; }
}
</style>
</head>

#th-audio { z-index: 115 !important; } /* B's sound control sat under the bar (z 110) since M4b: keep it clickable */
#bar { pointer-events: none; }
@media (max-height: 450px) { #th-prompt { font-size: 15px !important; padding: 6px 10px !important; gap: 8px !important; } #th-prompt .what { font-size: 12px !important; } #th-prompt .btn { padding: 6px 10px; } }
.m5bar { flex-wrap: nowrap !important; gap: 8px !important; padding-right: 150px !important; overflow: hidden; }
.m5bar > * { flex: none; }
.m5bar .ibtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; }
.m5bar svg, .tr-line svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.m5bar .pill svg { width: 13px; height: 13px; margin-right: 3px; }
.m5bar .b-short { display: none; }
.m5bar #relicbar .relic-ico { width: 26px; height: 26px; font-size: 11px; }
@media (max-width: 1000px) { .m5bar .lbl { display: none; } .m5bar .ibtn { padding: 6px 8px; } }
@media (max-width: 760px) { .m5bar { padding-right: 56px !important; gap: 6px !important; } .m5bar .b-full { display: none; } .m5bar .b-short { display: inline; } .m5bar #relicbar { display: none; } }
@media (max-height: 420px) { #topbar.m5bar { min-height: 40px; padding-top: 4px; padding-bottom: 4px; } }
.ib { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #3d4f7a; background: #101a2e; color: #9fd3ff; font: italic 800 13px/1 Georgia, serif; padding: 0; cursor: pointer; flex: none; }
.m5bar .ib.pill { width: auto; height: auto; border-radius: 999px; font: 700 14px/1.2 var(--font); padding: 4px 12px; color: var(--text); }
.m5pop { position: fixed; z-index: 130; max-width: min(340px, 92vw); background: #0d1220f5; border: 2px solid #3d4f7a; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4; color: #e9eefc; box-shadow: 0 10px 40px #000a; }
.biome.m5 { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.biome.m5 .name { font-size: 18px; }
.biome.m5 .qchip { margin-left: auto; font-weight: 800; color: var(--amber); white-space: nowrap; }
h2.m5h { display: flex; align-items: center; gap: 8px; }
.tr-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.tr-chip { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; color: #06070c; }
#full-test-row { display: block; color: var(--dim); font-size: 13px; font-weight: 700; margin: -2px 0 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#full-test-row input { vertical-align: -2px; margin: 0 4px 0 0; accent-color: #3df0ff; }
#full-test-row span { font-weight: 400; }
