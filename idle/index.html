<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dripfall</title>
<link rel="icon" href="data:,">
<style>
  :root { --paper:#f6efe2; --ink:#2b1d14; --dim:#7b6a5c; --panel:#fffaf0; --line:rgba(60,40,20,0.14); --accent:#e2365b; --gold:#c98a12; --ok:#2f8a4a;
    --font:"Trebuchet MS","Segoe UI",system-ui,"Liberation Sans",Arial,sans-serif;
    --sat:var(--safe-area-inset-top,0px); --sab:var(--safe-area-inset-bottom,0px); --sal:var(--safe-area-inset-left,0px); --sar:var(--safe-area-inset-right,0px); }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); font-family:var(--font);
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  body { background: radial-gradient(ellipse at 50% 40%, #fbf6ec 0%, #efe4d1 70%, #e4d5bd 100%); }
  #board { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud { position:fixed; z-index:5; }
  #top { top:calc(8px + var(--sat)); left:calc(10px + var(--sal)); display:flex; flex-direction:column; gap:4px; pointer-events:none; }
  #coins { font-size:30px; font-weight:900; letter-spacing:0.01em; color:#3a2414; text-shadow:0 2px 0 rgba(255,255,255,0.7); line-height:1; }
  #coins i { font-style:normal; color:var(--accent); margin-right:4px; }
  #rate { font-size:13px; font-weight:700; color:var(--dim); }
  #comm { width:min(320px, 52vw); background:rgba(255,250,240,0.85); border:1px solid var(--line); border-radius:10px; padding:5px 9px; font-size:12px; font-weight:700; color:#5a4636; }
  #comm .bar { height:7px; background:rgba(60,40,20,0.1); border-radius:4px; margin-top:4px; overflow:hidden; }
  #comm .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ffb35a,#e2365b); transition:width 0.3s; }
  #tools { position:fixed; z-index:6; display:flex; gap:6px; }
  #tools button, .btn { font-family:var(--font); font-weight:800; font-size:14px; color:var(--ink); background:#fff7e8; border:1px solid var(--line); border-radius:10px; padding:8px 11px; cursor:pointer; box-shadow:0 2px 0 rgba(60,40,20,0.12); }
  .btn:disabled { opacity:0.45; cursor:default; }
  .btn.hot { background:linear-gradient(180deg,#ff8a5a,#e2365b); color:#fff; border-color:#b8243f; }
  .btn.gold { background:linear-gradient(180deg,#ffe08a,#f0b22a); color:#3a2414; border-color:#b88a1a; }
  #brushbox { position:fixed; z-index:5; pointer-events:none; display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; color:#5a4636; }
  #brushbox .pot { width:120px; height:10px; border-radius:5px; background:rgba(60,40,20,0.12); overflow:hidden; border:1px solid var(--line); }
  #brushbox .pot i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ffd6a0,#e2365b); }
  #hint { position:fixed; z-index:7; left:0; right:0; text-align:center; pointer-events:none; font-weight:900; font-size:18px; color:#3a2414; text-shadow:0 2px 0 #fff, 0 0 12px #fff; }
  #side { position:fixed; z-index:6; background:var(--panel); border:1px solid var(--line); box-shadow:0 6px 24px rgba(60,40,20,0.15); display:flex; flex-direction:column; overflow:hidden; }
  #tabs { display:flex; border-bottom:1px solid var(--line); }
  #tabs button { flex:1; font-family:var(--font); font-weight:800; font-size:13px; padding:8px 4px; border:0; background:transparent; color:var(--dim); cursor:pointer; }
  #tabs button.on { color:var(--ink); box-shadow:inset 0 -3px 0 var(--accent); }
  #pane { overflow-y:auto; padding:6px 10px 10px; flex:1; touch-action:pan-y; }
  .row { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .nm { flex:1; min-width:0; font-weight:800; font-size:14px; }
  .row .nm small { font-weight:700; color:var(--dim); margin-left:4px; }
  .row .nm span { display:block; font-weight:500; font-size:12px; color:var(--dim); line-height:1.25; }
  .row .btn { min-width:84px; padding:7px 8px; font-size:13px; }
  .tag { display:inline-block; font-size:10px; font-weight:900; letter-spacing:0.06em; padding:2px 6px; border-radius:5px; color:#fff; text-transform:uppercase; vertical-align:middle; }
  .tag.Drip { background:#5b4bb0; } .tag.Brush { background:#e2365b; } .tag.Chain { background:#e8812a; } .tag.Frame { background:#b88a1a; } .tag.Gild { background:#2f8a4a; }
  .locked { color:var(--dim); font-size:12px; padding:8px 0; border-top:1px dashed var(--line); }
  #modal { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(40,25,15,0.45); }
  #modal .box { background:var(--panel); border-radius:16px; padding:18px 18px 16px; width:min(560px, calc(100% - 28px)); max-height:calc(100% - 28px); overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.3); text-align:center; touch-action:pan-y; }
  #modal h2 { margin:0 0 4px; font-size:24px; font-weight:900; }
  #modal p { margin:6px 0; color:#5a4636; font-size:14px; line-height:1.4; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:12px 0 4px; }
  .card { text-align:left; background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px; cursor:pointer; font-family:var(--font); color:var(--ink); }
  .card:hover { border-color:var(--accent); }
  .card b { display:block; font-size:16px; margin:6px 0 4px; }
  .card span.t { font-size:13px; color:#5a4636; line-height:1.3; }
  .card em { display:block; font-style:normal; font-size:12px; color:var(--ok); font-weight:800; margin-top:6px; }
  .studio { text-align:left; }
  .pips { display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle; }
  .pips i { width:9px; height:9px; border-radius:50%; background:rgba(60,40,20,0.15); display:inline-block; }
  .pips i.on { background:var(--gold); }
  .gal { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
  .gal canvas { border-radius:6px; border:3px solid #7a4a2a; background:#fff; }
  .adicon { display:inline-block; width:0; height:0; border-left:9px solid currentColor; border-top:6px solid transparent; border-bottom:6px solid transparent; margin-right:6px; vertical-align:-1px; }
  @media (max-width: 520px) { #coins { font-size:24px; } #comm { font-size:11px; } #hint { font-size:14px; padding:0 10px; } }
</style>
</head>
<body>
<canvas id="board"></canvas>
<script type="module" src="main.js"></script>
</body>
</html>
