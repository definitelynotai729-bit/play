<style>

:root { --navy: #25344a; --glass: rgba(29, 41, 61, 0.82); --cream: #fff6e5; --gold: #ffd166; --teal: #2bd1bd; --coral: #ff6a55; --bad: #ff6a7a; --good: #5dff8a; }

canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* title */
#title { flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; background: linear-gradient(90deg, rgba(25,36,62,0.66), rgba(25,36,62,0.22) 38%, rgba(25,36,62,0) 58%); align-items: flex-start; padding-left: 7vw; }
.logo { display: flex; flex-direction: column; align-items: center; line-height: 0.85; font-weight: 700; letter-spacing: 2px; filter: drop-shadow(0 6px 0 rgba(37,52,74,0.6)); }
.logo .l1 { font-size: clamp(54px, 13vw, 110px); color: var(--coral); -webkit-text-stroke: 3px #fff; }
.logo .l2 { font-size: clamp(54px, 13vw, 110px); color: #bff6ff; -webkit-text-stroke: 3px #25344a; opacity: 0.92; }
.logoimg { width: min(460px, 78vw); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25)); animation: logoin 0.7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes logoin { from { transform: scale(0.6) rotate(-6deg); opacity: 0; } }
.tag { font-size: 18px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 #25344a, 0 0 10px rgba(20,30,60,0.75); margin-bottom: 8px; text-align: center; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 90vw); }

.thead, .tbody { display: flex; flex-direction: column; gap: 10px; align-items: inherit; }

/* bars and lists */
.bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(rgba(29,41,61,0.85), rgba(29,41,61,0)); }

.gpanel { background: rgba(24,34,52,0.94); border-radius: 18px; padding: 10px 12px; width: min(860px, 100%); margin: 0 auto; max-height: 42vh; overflow-y: auto; touch-action: pan-y; }

.cnt { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; } .cnt.of { opacity: 0.85; font-size: 0.85em; }

.cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; max-width: 800px; margin: 0 auto; width: 100%; }
button.carbtn { background: rgba(255,255,255,0.08); border-radius: 14px; padding: 8px 4px; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 2px solid transparent; }

.note { text-align: center; opacity: 0.9; margin: 4px 0 12px; }
.note.bad { color: var(--bad); }

/* pre-race */
#pre { justify-content: flex-end; align-items: flex-end; padding: 16px; }

/* HUD */
#hud { pointer-events: none; }
#hud > * { position: absolute; }
#hud .top button, #hud .touch, #hud .pausemenu, #hud .pausemenu button { pointer-events: auto; }
body.touchmode .only-keys, body:not(.touchmode) .only-touch { display: none !important; }
#hud .top { top: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; }
#hud .time { font-size: 38px; font-weight: 700; text-shadow: 0 3px 0 rgba(37,52,74,0.8); min-width: 190px; text-align: center; font-variant-numeric: tabular-nums; }
.pausebtn, .resetbtn { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--glass); font-weight: 700; font-size: 18px; }
.resetbtn { width: 62px; font-size: 14px; padding: 0; }
#hud .split { top: 66px; left: 50%; transform: translateX(-50%) scale(0.8); font-size: 28px; font-weight: 700; padding: 2px 14px; border-radius: 10px; background: var(--glass); opacity: 0; transition: 0.15s; font-variant-numeric: tabular-nums; }
#hud .split.show { opacity: 1; transform: translateX(-50%) scale(1); }
#hud .split.good { color: var(--good); } #hud .split.bad { color: var(--bad); }
#hud .hl, #hud .hr { top: 14px; display: flex; flex-direction: column; gap: 4px; text-shadow: 0 2px 0 #25344a; }
#hud .hl { left: 16px; align-items: flex-start; } #hud .hr { right: 16px; align-items: flex-end; }
#hud .cp { font-size: 18px; }
#hud .target { font-size: 16px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
#hud .count { top: 32%; left: 50%; transform: translate(-50%, -50%) scale(0.6); font-size: 110px; font-weight: 700; color: #fff; -webkit-text-stroke: 4px #25344a; opacity: 0; transition: transform 0.15s, opacity 0.2s; }
#hud .count.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#hud .count.go { color: var(--gold); }
#hud .flash { top: 45%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 700; color: var(--gold); text-shadow: 0 3px 0 #25344a; opacity: 0; transition: opacity 0.2s; }
#hud .flash.show { opacity: 1; }
#hud .hint { bottom: 22%; left: 50%; transform: translateX(-50%); background: var(--glass); padding: 8px 14px; border-radius: 12px; font-size: 17px; white-space: nowrap; max-width: 92vw; white-space: normal; text-align: center; }
body.touchmode #hud .hint { bottom: 150px; top: auto; }
#hud .stars { font-size: 18px; font-weight: 700; color: #ffd23f; text-shadow: 0 2px 0 #25344a; }
#hud .stars.bump { animation: bump 0.3s ease-out; }
@keyframes bump { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
body.coaching #hud .top, body.coaching #hud .hl, body.coaching #hud .hr { margin-top: 62px; } body.coaching #hud .split, body.coaching #hud .tip { margin-top: 58px; }
#hud .stuck { display: none; top: 34%; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 #25344a; align-items: center; gap: 10px; white-space: nowrap; }
#hud .stuck.show { display: flex; } #hud .stuck.show button { pointer-events: auto; }
#hud .tip { top: 112px; left: 50%; transform: translateX(-50%); max-width: min(440px, 92vw); width: max-content; background: var(--glass); border: 1px solid #ffd16655; padding: 7px 14px; border-radius: 12px; font-size: 16px; text-align: center; opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s; }
#hud .tip.show { opacity: 1; visibility: visible; }
#hud .wrongway { display: none; top: 30%; left: 50%; transform: translateX(-50%); background: #d8323f; color: #fff; font-size: 26px; font-weight: 700; padding: 6px 18px; border-radius: 12px; white-space: nowrap; }
#hud .wrongway.show { display: block; animation: ww 0.7s infinite alternate; }
@keyframes ww { to { opacity: 0.55; } }
#hud .steerwait { display: none; top: 34%; left: 50%; transform: translateX(-50%); width: max-content; max-width: 88vw; background: var(--glass); border: 2px solid var(--gold); color: #fff; font-size: 22px; font-weight: 700; text-align: center; padding: 10px 18px; border-radius: 14px; }
#hud.waiting .zone span { animation: zpulse 0.8s infinite alternate; } @keyframes zpulse { to { transform: scale(1.2); background: rgba(255,209,102,0.8); color: #25344a; } }
#hud .hint.off { display: none; }
body.paused .coachkey, body.paused #hud .tip, body.paused #hud .steerwait, body.paused #hud .stuck, body.paused #hud .wrongway { visibility: hidden; }
body.coaching #hud .count { top: 40%; } @media (max-height: 600px) { #hud .count { font-size: 72px; top: 44%; } body.coaching #hud .count { top: 46%; } }
body.touchmode #hud .charge { bottom: 124px; }
body.paused .kc-root, body:not([data-screen="hud"]) .kc-root { display: none; }
body .kc-tracker { max-width: calc(100vw - 16px); } body .kc-text span { white-space: normal; }
@media (max-width: 480px) { body .kc-tracker { border-radius: 18px; gap: 8px; width: calc(100vw - 16px); } body .kc-text { flex: 1; } body .kc-text span { font-size: 16px; } body .kc-dots { display: none; } }
#hud .stuck .kcap { animation: keypress 1s infinite; }
.coachkey { bottom: 26%; left: 50%; width: max-content; max-width: 94vw; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; pointer-events: none; }
.coachkey[data-key="none"] .kcap { display: none; }
.coachkey .ktext { font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 #25344a, 0 0 12px rgba(0,0,0,0.4); }
.kcap { min-width: 72px; text-align: center; padding: 8px 18px; border-radius: 12px; background: #f4f1ea; color: #25344a; font-weight: 700; font-size: 20px; box-shadow: 0 7px 0 #9aa3b8; }
.coachkey[data-key="press"] .kcap { animation: keypress 1s infinite; }
.coachkey[data-key="hold"] .kcap { transform: translateY(6px); box-shadow: 0 1px 0 #9aa3b8; background: #ffd166; }
.coachkey[data-key="release"] .kcap { animation: keyrel 0.6s infinite; background: #5fe1ff; }
@keyframes keypress { 0%, 40% { transform: none; box-shadow: 0 7px 0 #9aa3b8; } 55%, 100% { transform: translateY(6px); box-shadow: 0 1px 0 #9aa3b8; } }
@keyframes keyrel { 0% { transform: translateY(6px); box-shadow: 0 1px 0 #9aa3b8; } 60%, 100% { transform: none; box-shadow: 0 7px 0 #9aa3b8; } }
#hud .speed { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
#hud .charge { bottom: 12%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0; transition: opacity 0.15s; }
#hud .charge span { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 0 #25344a; }
#hud .charge div { width: 150px; height: 12px; border-radius: 6px; background: #25344aaa; overflow: hidden; border: 2px solid #fff6; }
#hud .charge.on { opacity: 1; }
#hud .charge i { display: block; height: 100%; background: #fff; }
#hud .charge.lv1 i { background: #4fd8ff; } #hud .charge.lv2 i { background: #ff9a2e; }
.touch { display: none; inset: auto 0 0 0; height: 46%; }
body.touchmode .touch { display: block; }
.touch .tl, .touch .tr { position: absolute; bottom: calc(16px + var(--safe-area-inset-bottom, 0px)); display: flex; gap: 12px; }

.touch .zone span { width: 76px; height: 76px; border-radius: 50%; background: rgba(29,41,61,0.35); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; }
.touch .zone.on span { background: rgba(255,209,102,0.75); color: #25344a; }
.touch .fl { position: absolute; right: 22px; top: 0; width: 84px; height: 84px; }
.tset { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
button.small.on { border-color: var(--teal); }
.touch .tl { left: 16px; } .touch .tr { right: 16px; align-items: flex-end; }
.tbtn { width: 84px; height: 84px; border-radius: 22px; background: rgba(29,41,61,0.45); border: 2px solid rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #fff; }
.tbtn.drift { width: 104px; height: 104px; background: rgba(255,106,85,0.5); font-size: 20px; }
.tbtn.brake { width: 72px; height: 64px; font-size: 14px; }
.tbtn.on { background: rgba(255,209,102,0.75); color: #25344a; }
.pausemenu { display: none; inset: 0; align-items: center; justify-content: center; background: rgba(20,28,44,0.5); }
#hud.paused .pausemenu { display: flex; }
.panel { background: var(--glass); border-radius: 20px; padding: 20px; border: 1px solid #ffd16666; display: flex; flex-direction: column; gap: 10px; width: min(360px, 92vw); max-height: 90vh; overflow-y: auto; }
.panel h2 { margin: 0 0 4px; text-align: center; }
.panel p { margin: 0; line-height: 1.35; font-size: 16px; }
.helpp { overflow: hidden; } .helpbody { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; } .helpp button { flex: none; }
.modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20,28,44,0.55); z-index: 30; }

/* finish */
#finish { align-items: center; justify-content: flex-end; padding: 16px 6vw; }
@media (max-aspect-ratio: 1/1) { #finish { align-items: flex-end; justify-content: center; padding: 16px; } }
.fin { align-items: center; text-align: center; } .finhead, .fininfo, .finbtns { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; } .fininfo { gap: 4px; } .fininfo .note { margin: 0; } .unl { color: var(--good); font-weight: 700; } .medalwon .medal svg { width: 84px; height: 84px; }
.ftime { font-size: 50px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pbtag { background: var(--gold); color: #25344a; padding: 3px 12px; border-radius: 10px; font-weight: 700; }
.delta { opacity: 0.85; } .delta.bad { color: #ffb3bb; }

@keyframes medalpop { 0% { transform: scale(0) rotate(-200deg); } 70% { transform: scale(1.15) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
.shine { position: absolute; inset: -18px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 10%, rgba(255,240,170,0.65) 12% 16%, transparent 18% 35%, rgba(255,240,170,0.65) 37% 41%, transparent 43% 60%, rgba(255,240,170,0.65) 62% 66%, transparent 68% 85%, rgba(255,240,170,0.65) 87% 91%, transparent 93%); animation: spin 4s linear infinite; z-index: -1; }
@keyframes spin { to { transform: rotate(360deg); } }
.starline { color: #ffd23f; font-size: 17px; }
.pbtag { animation: medalpop 0.6s cubic-bezier(.2,1.6,.4,1) both; animation-delay: 0.15s; }
.next { font-size: 15px; opacity: 0.9; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%; }
.row button.big { flex: 1; }

/* editor */

#editor > * { pointer-events: auto; }
.einfo { margin-left: auto; opacity: 0.85; }
.epanel { position: absolute; right: 12px; top: 64px; bottom: 12px; width: 330px; overflow: hidden; background: rgba(24,34,52,0.94); border-radius: 16px; display: flex; flex-direction: column; }
.ebody { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; }
.efoot { flex: none; display: grid; grid-template-columns: 70px 1fr 1.2fr; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #ffffff22; } .efoot button { font-size: 16px; padding: 11px 4px; white-space: nowrap; }
.egrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .egrid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; } .egrid2 button, .egrid3 button { white-space: nowrap; overflow: hidden; padding: 8px 2px !important; }

.einfo.bad { color: #ffb3bb; opacity: 1; }

.esec { display: flex; flex-direction: column; gap: 6px; }
.etitle { font-size: 14px; opacity: 0.8; }
.egrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.erow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pl { flex: 1; font-size: 15px; }
button.eb { background: rgba(255,255,255,0.1); border: 1px solid #ffffff2a; padding: 7px 9px; border-radius: 9px; font-size: 14px; }
button.eb:hover { border-color: var(--gold); }
button.eb.warn { color: #ffc2c8; }
