<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Drift Ghost</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Fredoka'; font-weight: 500; font-display: swap; src: url(fredoka-500.woff2) format('woff2'); }
@font-face { font-family: 'Fredoka'; font-weight: 700; font-display: swap; src: url(fredoka-700.woff2) format('woff2'); }
:root { --navy: #25344a; --glass: rgba(29, 41, 61, 0.82); --cream: #fff6e5; --gold: #ffd166; --teal: #2bd1bd; --coral: #ff6a55; --bad: #ff6a7a; --good: #5dff8a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0ff; color: var(--cream); font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 500; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
.screen { position: fixed; inset: 0; display: none; }
.screen.on { display: flex; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: linear-gradient(#5fb4ff, #fff0d6); color: #25344a; font-size: 28px; font-weight: 700; z-index: 50; }
#loading .bar { width: 160px; height: 10px; border-radius: 6px; background: #25344a33; margin-top: 14px; overflow: hidden; }
#loading .bar i { display: block; height: 100%; width: 40%; background: var(--coral); animation: ld 1s infinite ease-in-out alternate; }
@keyframes ld { from { margin-left: 0 } to { margin-left: 60% } }

/* title */
#title { flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; background: linear-gradient(90deg, rgba(25,36,62,0.78), rgba(25,36,62,0.35) 45%, rgba(25,36,62,0) 70%); align-items: flex-start; padding-left: 7vw; }
.logo { display: flex; flex-direction: column; align-items: center; line-height: 0.85; font-weight: 700; letter-spacing: 2px; filter: drop-shadow(0 6px 0 rgba(37,52,74,0.6)); }
.logo .l1 { font-size: clamp(54px, 13vw, 110px); color: var(--coral); -webkit-text-stroke: 3px #fff; }
.logo .l2 { font-size: clamp(54px, 13vw, 110px); color: #bff6ff; -webkit-text-stroke: 3px #25344a; opacity: 0.92; }
.logoimg { width: min(460px, 78vw); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25)); animation: logoin 0.7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes logoin { from { transform: scale(0.6) rotate(-6deg); opacity: 0; } }
.tag { font-size: 18px; color: #fff; text-shadow: 0 2px 0 #25344a; margin-bottom: 8px; text-align: center; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 90vw); }
button.big { background: var(--glass); border: 2px solid rgba(255,209,102,0.35); padding: 13px 18px; border-radius: 16px; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 0 rgba(0,0,0,0.25); transition: transform 0.08s; }
button.big:hover { transform: translateY(-2px); border-color: var(--gold); }
button.big:active { transform: translateY(2px); box-shadow: none; }
button.big.main { background: linear-gradient(180deg, #ff7b5c, #ffb547); color: #25344a; border-color: #fff3; }
button.big.alt { background: rgba(43,209,189,0.25); }
button.small { background: var(--glass); padding: 8px 14px; border-radius: 12px; font-size: 15px; border: 1px solid rgba(255,209,102,0.3); }
.pill { font-size: 13px; background: var(--gold); color: #25344a; padding: 2px 8px; border-radius: 10px; }
.stats { margin-top: 6px; font-size: 18px; display: flex; align-items: center; gap: 4px; text-shadow: 0 2px 0 #25344a; }
.foot { display: flex; gap: 8px; margin-top: 8px; }
.medal { display: inline-flex; vertical-align: middle; }

/* bars and lists */
.bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(rgba(29,41,61,0.85), rgba(29,41,61,0)); }
.bar h2 { margin: 0; font-size: 24px; }
button.back { background: var(--glass); border-radius: 12px; padding: 8px 14px; font-size: 17px; border: 1px solid #ffd16655; }
#levels, #garage { flex-direction: column; overflow-y: auto; padding: 70px 16px 24px; touch-action: pan-y; background: rgba(29,41,61,0.35); }
#garage { justify-content: flex-end; background: linear-gradient(rgba(29,41,61,0) 35%, rgba(29,41,61,0.88)); }
.tiers { display: flex; flex-direction: column; gap: 14px; max-width: 980px; width: 100%; margin: 0 auto; }
.tier h3 { margin: 0 0 8px; font-size: 19px; text-shadow: 0 2px 0 #25344a; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
button.card { position: relative; background: var(--glass); border-radius: 14px; padding: 10px 12px; text-align: left; border: 2px solid transparent; border-bottom: 4px solid var(--tc); min-height: 84px; }
button.card:hover { border-color: var(--gold); border-bottom-color: var(--tc); }
button.card.locked { opacity: 0.45; }
.card .num { font-size: 13px; opacity: 0.7; }
.card .nm { font-size: 17px; font-weight: 700; }
.card .bt { font-size: 14px; opacity: 0.85; margin-top: 4px; }
.card .md { position: absolute; right: 8px; top: 8px; }
.cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 800px; margin: 0 auto; width: 100%; }
button.carbtn { background: var(--glass); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 2px solid transparent; }
button.carbtn.sel { border-color: var(--gold); }
button.carbtn.locked { opacity: 0.7; }
.sw { width: 56px; height: 30px; border-radius: 8px; border: 4px solid; }
.note { text-align: center; opacity: 0.9; margin: 4px 0 12px; }
.note.bad { color: var(--bad); }

/* pre-race */
#pre { justify-content: flex-end; align-items: flex-end; padding: 16px; }
.prebody { background: var(--glass); border-radius: 18px; padding: 16px 18px; width: min(340px, 100%); display: flex; flex-direction: column; gap: 8px; border: 1px solid #ffd16655; }
.sub { opacity: 0.8; font-size: 15px; }
.medals { display: flex; flex-direction: column; gap: 4px; }
.mrow { display: flex; align-items: center; gap: 8px; font-size: 17px; opacity: 0.75; }
.mrow b { margin-left: auto; }
.mrow.got { opacity: 1; color: var(--gold); }
.pb { font-size: 16px; }
.lbl { font-size: 14px; opacity: 0.8; }
.ghosts { display: flex; flex-wrap: wrap; gap: 6px; }
button.chip { background: rgba(255,255,255,0.08); border: 1px solid #ffffff33; padding: 6px 10px; border-radius: 10px; font-size: 14px; display: flex; gap: 6px; align-items: center; }
button.chip.sel { background: var(--teal); color: #16283a; border-color: var(--teal); }
.ad { font-size: 10px; background: var(--gold); color: #25344a; padding: 1px 4px; border-radius: 4px; font-weight: 700; }

/* HUD */
#hud { pointer-events: none; }
#hud > * { position: absolute; }
#hud button, #hud .touch, #hud .pausemenu { pointer-events: auto; }
#hud .top { top: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; }
#hud .time { font-size: 38px; font-weight: 700; text-shadow: 0 3px 0 rgba(37,52,74,0.8); min-width: 190px; text-align: center; font-variant-numeric: tabular-nums; }
.pausebtn, .resetbtn { width: 44px; height: 44px; border-radius: 12px; background: var(--glass); font-weight: 700; font-size: 18px; }
#hud .split { top: 66px; left: 50%; transform: translateX(-50%) scale(0.8); font-size: 28px; font-weight: 700; padding: 2px 14px; border-radius: 10px; background: var(--glass); opacity: 0; transition: 0.15s; font-variant-numeric: tabular-nums; }
#hud .split.show { opacity: 1; transform: translateX(-50%) scale(1); }
#hud .split.good { color: var(--good); } #hud .split.bad { color: var(--bad); }
#hud .cp { top: 16px; right: 16px; font-size: 18px; text-shadow: 0 2px 0 #25344a; }
#hud .target { top: 16px; left: 16px; font-size: 16px; text-shadow: 0 2px 0 #25344a; display: flex; align-items: center; gap: 4px; }
#hud .count { top: 32%; left: 50%; transform: translate(-50%, -50%) scale(0.6); font-size: 110px; font-weight: 700; color: #fff; -webkit-text-stroke: 4px #25344a; opacity: 0; transition: transform 0.15s, opacity 0.2s; }
#hud .count.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#hud .count.go { color: var(--gold); }
#hud .flash { top: 45%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 700; color: var(--gold); text-shadow: 0 3px 0 #25344a; opacity: 0; transition: opacity 0.2s; }
#hud .flash.show { opacity: 1; }
#hud .hint { bottom: 22%; left: 50%; transform: translateX(-50%); background: var(--glass); padding: 8px 14px; border-radius: 12px; font-size: 17px; white-space: nowrap; max-width: 92vw; white-space: normal; text-align: center; }
body.touchmode #hud .hint { bottom: 150px; top: auto; }
#hud .stars { top: 40px; left: 16px; font-size: 18px; font-weight: 700; color: #ffd23f; text-shadow: 0 2px 0 #25344a; }
#hud .stars.bump { animation: bump 0.3s ease-out; }
@keyframes bump { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
body.coaching #hud .top { top: 62px; } body.coaching #hud .split { top: 120px; }
#hud .stuck { top: 40%; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.25s; pointer-events: none; font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 #25344a; display: flex; align-items: center; gap: 10px; }
#hud .stuck.show { opacity: 1; pointer-events: auto; }
#hud .stuck .kcap { animation: keypress 1s infinite; }
.coachkey { bottom: 24%; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; pointer-events: none; }
.coachkey[data-key="none"] .kcap { display: none; }
.coachkey .ktext { font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 #25344a, 0 0 12px rgba(0,0,0,0.4); }
.kcap { min-width: 72px; text-align: center; padding: 8px 18px; border-radius: 12px; background: #f4f1ea; color: #25344a; font-weight: 700; font-size: 20px; box-shadow: 0 7px 0 #9aa3b8; }
.coachkey[data-key="press"] .kcap { animation: keypress 1s infinite; }
.coachkey[data-key="hold"] .kcap { transform: translateY(6px); box-shadow: 0 1px 0 #9aa3b8; background: #ffd166; }
.coachkey[data-key="release"] .kcap { animation: keyrel 0.6s infinite; background: #5fe1ff; }
@keyframes keypress { 0%, 40% { transform: none; box-shadow: 0 7px 0 #9aa3b8; } 55%, 100% { transform: translateY(6px); box-shadow: 0 1px 0 #9aa3b8; } }
@keyframes keyrel { 0% { transform: translateY(6px); box-shadow: 0 1px 0 #9aa3b8; } 60%, 100% { transform: none; box-shadow: 0 7px 0 #9aa3b8; } }
#hud .speed { bottom: 18px; right: 20px; font-size: 22px; font-weight: 700; text-shadow: 0 2px 0 #25344a; font-variant-numeric: tabular-nums; }
#hud .charge { bottom: 52px; right: 20px; width: 120px; height: 10px; border-radius: 6px; background: #25344a88; overflow: hidden; opacity: 0; transition: opacity 0.15s; }
#hud .charge.on { opacity: 1; }
#hud .charge i { display: block; height: 100%; background: #fff; }
#hud .charge.lv1 i { background: #4fd8ff; } #hud .charge.lv2 i { background: #ff9a2e; }
.touch { display: none; inset: auto 0 0 0; height: 46%; }
body.touchmode .touch { display: block; }
body.touchmode #hud .speed { bottom: auto; top: 92px; right: 12px; font-size: 16px; }
body.touchmode #hud .charge { bottom: auto; top: 118px; right: 12px; width: 90px; }
.touch .tl, .touch .tr { position: absolute; bottom: calc(16px + var(--safe-area-inset-bottom, 0px)); display: flex; gap: 12px; }
.touch.halves { height: 62%; }
.touch .zone { position: absolute; top: 0; bottom: 0; width: 50%; display: flex; align-items: flex-end; padding: 0 0 calc(22px + var(--safe-area-inset-bottom, 0px)); }
.touch .zl { left: 0; justify-content: flex-start; padding-left: calc(22px + var(--safe-area-inset-left, 0px)); }
.touch .zr { right: 0; justify-content: flex-end; padding-right: calc(22px + var(--safe-area-inset-right, 0px)); }
.touch .zone span { width: 76px; height: 76px; border-radius: 50%; background: rgba(29,41,61,0.35); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; }
.touch .zone.on span { background: rgba(255,209,102,0.75); color: #25344a; }
.touch .zone.on { background: linear-gradient(transparent, rgba(255,255,255,0.08)); }
.touch .fl { position: absolute; right: 22px; top: 0; width: 84px; height: 84px; }
.tset { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
button.small.on { border-color: var(--teal); }
.touch .tl { left: 16px; } .touch .tr { right: 16px; align-items: flex-end; }
.tbtn { width: 84px; height: 84px; border-radius: 22px; background: rgba(29,41,61,0.45); border: 2px solid rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #fff; }
.tbtn.drift { width: 104px; height: 104px; background: rgba(255,106,85,0.5); font-size: 20px; }
.tbtn.brake { width: 72px; height: 64px; font-size: 14px; }
.tbtn.on { background: rgba(255,209,102,0.75); color: #25344a; }
.pausemenu { display: none; inset: 0; align-items: center; justify-content: center; background: rgba(20,28,44,0.5); }
#hud.paused .pausemenu { display: flex; }
.panel { background: var(--glass); border-radius: 20px; padding: 20px; border: 1px solid #ffd16666; display: flex; flex-direction: column; gap: 10px; width: min(360px, 92vw); max-height: 90vh; overflow-y: auto; }
.panel h2 { margin: 0 0 4px; text-align: center; }
.panel p { margin: 0; line-height: 1.35; font-size: 16px; }
.modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20,28,44,0.55); z-index: 30; }

/* finish */
#finish { align-items: center; justify-content: flex-end; padding: 16px 6vw; }
@media (max-aspect-ratio: 1/1) { #finish { align-items: flex-end; justify-content: center; padding: 16px; } }
.fin { align-items: center; text-align: center; }
.ftime { font-size: 50px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pbtag { background: var(--gold); color: #25344a; padding: 3px 12px; border-radius: 10px; font-weight: 700; }
.delta { opacity: 0.85; } .delta.bad { color: #ffb3bb; }
.medalwon { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
.medalbig { position: relative; display: flex; }
.medalwon.pop .medalbig { animation: medalpop 0.9s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes medalpop { 0% { transform: scale(0) rotate(-200deg); } 70% { transform: scale(1.15) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
.shine { position: absolute; inset: -18px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 10%, rgba(255,240,170,0.65) 12% 16%, transparent 18% 35%, rgba(255,240,170,0.65) 37% 41%, transparent 43% 60%, rgba(255,240,170,0.65) 62% 66%, transparent 68% 85%, rgba(255,240,170,0.65) 87% 91%, transparent 93%); animation: spin 4s linear infinite; z-index: -1; }
@keyframes spin { to { transform: rotate(360deg); } }
.starline { color: #ffd23f; font-size: 17px; }
.pbtag { animation: medalpop 0.6s cubic-bezier(.2,1.6,.4,1) both; animation-delay: 0.15s; }
.next { font-size: 15px; opacity: 0.9; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%; }
.row button.big { flex: 1; }

/* editor */
#editor { pointer-events: none; }
#editor > * { pointer-events: auto; }
.einfo { margin-left: auto; opacity: 0.85; }
.epanel { position: absolute; right: 12px; top: 64px; bottom: 12px; width: 330px; overflow-y: auto; background: var(--glass); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; }
.esec { display: flex; flex-direction: column; gap: 6px; }
.etitle { font-size: 14px; opacity: 0.8; }
.egrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.erow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pl { flex: 1; font-size: 15px; }
button.eb { background: rgba(255,255,255,0.1); border: 1px solid #ffffff2a; padding: 7px 9px; border-radius: 9px; font-size: 14px; }
button.eb:hover { border-color: var(--gold); }
button.eb.warn { color: #ffc2c8; }
button.eb.hi { background: var(--teal); color: #16283a; font-weight: 700; }
button.eb.go { background: linear-gradient(180deg, #ff7b5c, #ffb547); color: #25344a; font-weight: 700; }
.eact button { flex: 1; font-size: 17px; padding: 11px; }
.estatus { font-size: 14px; line-height: 1.35; padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
.estatus.bad { background: rgba(255,106,122,0.2); color: #ffd0d5; }
.estatus.ok { background: rgba(93,255,138,0.15); }
.emed { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0; }
.mylist { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 700px) {
  #title { align-items: center; padding-left: 16px; background: linear-gradient(rgba(25,36,62,0.2), rgba(25,36,62,0.75)); }
  .epanel { left: 8px; right: 8px; width: auto; top: auto; height: 52%; }
  .egrid { grid-template-columns: repeat(4, 1fr); }
  #hud .time { font-size: 30px; min-width: 150px; }
  #hud .target { top: 62px; left: 12px; font-size: 14px; }
  #hud .cp { top: 62px; right: 12px; font-size: 14px; }
  #hud .split { top: 92px; }
  #pre { align-items: flex-end; justify-content: center; }
}
body.clean #hud, body.clean #finish, body.clean #toast, body.clean .modal { display: none !important; }
body.covermode .screen, body.covermode #toast, body.covermode .modal { display: none !important; }
@media (max-height: 600px) {
  #title { gap: 6px; padding: 8px 16px; }
  .logoimg { width: min(330px, 46vh * 1.5); }
  .tag { font-size: 15px; margin-bottom: 2px; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; width: min(520px, 92vw); gap: 8px; }
  button.big { padding: 10px 14px; font-size: 18px; }
  .stats { margin-top: 2px; font-size: 15px; } .foot { margin-top: 2px; }
  .prebody { padding: 10px 14px; gap: 5px; max-height: calc(100vh - 70px); overflow-y: auto; }
  .mrow { font-size: 15px; }
}
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--navy); padding: 10px 16px; border-radius: 12px; opacity: 0; transition: 0.2s; z-index: 40; pointer-events: none; text-align: center; max-width: 90vw; }
#toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="screen"></div>
<div id="levels" class="screen"></div>
<div id="garage" class="screen"></div>
<div id="pre" class="screen"></div>
<div id="hud" class="screen"></div>
<div id="pause" class="screen"></div>
<div id="finish" class="screen"></div>
<div id="editor" class="screen"></div>
<div id="toast"></div>
<div id="loading"><img src="logo.png" alt="Drift Ghost" style="width:min(420px,80vw)"><div class="bar"><i></i></div></div>
<script type="module" src="main.js"></script>
</body>
</html>
