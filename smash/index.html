<style>
:root{--ink:#2d2219;--paper:#f8f1e6;--accent:#b9463c;--accent2:#cf5a4a;--gold:#d6a63c;--ok:#3ccf7a;--font:ui-rounded,"Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd9a8;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff;text-shadow:0 3px 0 #c0502a;background:linear-gradient(#7fc8ff,#ffe3b0 60%,#ffb36b)}
#hud,#fx{position:fixed;inset:0;pointer-events:none}

.nohud #hud,.nohud #fx,.nohud #toast,.nohud .kc-root,.capmode .kc-root{display:none!important}
button{font-family:var(--font);cursor:pointer;border:0}
.hidden{display:none!important}
.top{position:absolute;top:max(8px,var(--safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}

.ib{width:44px;height:44px;border-radius:14px;background:var(--paper);color:var(--ink);padding:10px;box-shadow:0 4px 0 #0003;flex:none}

.obj{flex:1;min-width:0;background:#fff8ecdd;border-radius:14px;padding:6px 10px;box-shadow:0 4px 0 #0002}

.otext{font-size:12.5px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:#2a1d3a22;border-radius:6px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3a,#ff5a3a);border-radius:6px;transition:width .2s}
.bar i.done{background:linear-gradient(90deg,#3ccf7a,#2aa860)}
.score{background:var(--ink);color:#fff;border-radius:14px;padding:4px 12px;text-align:center;min-width:86px;box-shadow:0 4px 0 #0003}
#score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stars b{color:#ffffff40;font-size:14px}.stars b.on{color:var(--gold)}
.bottom{position:absolute;left:0;right:0;bottom:max(8px,var(--safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;padding:0 8px;pointer-events:none}

.tools{display:flex;gap:6px;overflow-x:auto;flex:1;padding:4px 2px 6px;scrollbar-width:none}
.tool{position:relative;width:70px;flex:none;height:78px;border-radius:16px;background:var(--paper);box-shadow:0 5px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px 4px;color:var(--ink)}
.tool .ic{width:34px;height:34px}.tool .tn{font-size:10.5px;font-weight:800;margin-top:2px;white-space:nowrap}
.tool .cnt{position:absolute;top:-6px;right:-4px;background:var(--ink);color:#fff;border-radius:10px;min-width:22px;height:22px;font-size:13px;font-weight:900;display:grid;place-items:center;padding:0 5px}
.tool.sel{background:#fff;outline:4px solid var(--tc);transform:translateY(-4px)}
.tool.empty{opacity:.45}
.tool:disabled{opacity:.35}
.lk{display:inline-block;width:12px;height:12px;vertical-align:-1px}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.det{background:linear-gradient(var(--accent2),var(--accent));color:#fff;font-weight:900;font-size:18px;border-radius:18px;padding:16px 18px;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#000);letter-spacing:.5px;animation:pulse 1s infinite}
.det:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.fin{background:linear-gradient(#5ae08a,#2aa860);color:#fff;font-weight:900;font-size:15px;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 #146a38}
.small{background:var(--paper);border-radius:12px;padding:8px 12px;font-weight:800;box-shadow:0 3px 0 #0003}
@keyframes pulse{50%{transform:scale(1.05)}}
.presets{position:absolute;top:calc(max(8px,var(--safe-area-inset-top,0px)) + 62px);left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.presets button{background:#fff8ecdd;border-radius:12px;padding:7px 10px;font-weight:800;font-size:12.5px;white-space:nowrap;box-shadow:0 3px 0 #0002}
.presets button.on{background:var(--ink);color:#fff}
.presets .mega{background:linear-gradient(#fff3a0,#ffc83a)}
.chainb{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:56px;font-weight:900;color:#fff;-webkit-text-stroke:3px #c0281a;text-shadow:0 6px 0 #c0281a,0 10px 24px #0005;opacity:0;pointer-events:none!important;transform:scale(var(--s,1))}
.chainb.go{animation:chain 1.1s ease-out}
@keyframes chain{0%{opacity:0;transform:scale(calc(var(--s)*1.8)) rotate(-6deg)}12%{opacity:1;transform:scale(var(--s)) rotate(-3deg)}70%{opacity:1}100%{opacity:0;transform:scale(calc(var(--s)*0.95)) translateY(-20px) rotate(-3deg)}}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:17px;color:#fff;-webkit-text-stroke:1.5px #2a1d3a;text-shadow:0 2px 0 #2a1d3a;white-space:nowrap;animation:pop .9s ease-out forwards}
.pop.big{font-size:24px;color:#ffe14a}.pop.bad{color:#ff6a6a}.pop.gone{display:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(max(8px,var(--safe-area-inset-bottom,0px)) + 100px);transform:translate(-50%,20px);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#2a1d3a55;padding:16px;overflow:auto}
#modal.on{display:grid}

#modal.titlem h1{font-size:clamp(40px,9vw,64px);margin:0}
#modal.titlem .tag{margin:8px 0 12px}

.card{background:var(--paper);border-radius:24px;padding:20px;box-shadow:0 10px 0 #0003,0 20px 60px #0004;max-width:min(560px,100%);width:100%;text-align:center;max-height:calc(100vh - 32px);overflow:auto}
.card.light{max-width:340px}
.title h1{font-size:clamp(44px,11vw,76px);line-height:.92;margin:6px 0 4px;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 7px 0 var(--ink);letter-spacing:1px;transform:rotate(-3deg)}
.title .tag{font-weight:800;opacity:.75;margin:14px 0 16px}
.btn{background:#fff;border-radius:16px;padding:12px 18px;font-weight:900;font-size:16px;box-shadow:0 5px 0 #0003;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.btn.primary{background:linear-gradient(var(--accent2),var(--accent));color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}

.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{background:transparent;font-weight:800;font-size:13px;opacity:.7;padding:6px 10px;border-radius:10px;color:var(--ink)}

.lock{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.lv{background:#fff;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 #0003;color:var(--ink)}

.lv.locked{opacity:.45}
.results h2{font-size:34px;margin:4px 0}
.rstars b{font-size:56px;color:#2a1d3a25;display:inline-block;margin:0 2px}
.rstars b.on{color:var(--gold);text-shadow:0 4px 0 #b07a00;animation:star .5s backwards cubic-bezier(.3,1.8,.5,1)}
@keyframes star{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1)}}
.rscore{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.best{font-size:14px;background:var(--accent);color:#fff;border-radius:8px;padding:2px 6px;vertical-align:middle}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:10px auto;max-width:360px;font-size:14px}
.rows div{display:flex;justify-content:space-between}.rows span{opacity:.7;font-weight:700}
.why{font-weight:800;color:#c0281a;margin:4px}.unlock{font-weight:900;color:#2aa860}.streak{font-weight:800}
.newtool .kick{font-weight:900;color:var(--accent);letter-spacing:2px}.newtool .bigic{width:96px;height:96px;margin:8px auto}.newtool h2{margin:4px}
#cap{position:fixed;left:6%;right:6%;top:9%;text-align:center;font-weight:900;font-size:34px;line-height:1.15;color:#fff;-webkit-text-stroke:2px #2a1d3a;text-shadow:0 4px 0 #2a1d3a;display:none;z-index:5}

.themes.big .theme img{width:104px;height:59px}.themes.big .theme{font-size:13px}
.settingsp{text-align:left}.settingsp h3{margin:14px 0 4px;font-size:15px}.settingsp .row{justify-content:flex-start}.settingsp .note{font-size:12px;opacity:.7;margin-top:12px}
